# Apache vhost for the Ranz portfolio.
#
# Recommended setup: Apache serves the built static client directly (fast) and
# reverse-proxies only the API and media to the Node process on 127.0.0.1:3001.
#
# One-time enablement:
#   sudo a2enmod proxy proxy_http rewrite headers
#
# Put this in your existing site's vhost (e.g. the :443 block for
# ranz-bontogon.com). Keep your existing SSL directives; just set the
# DocumentRoot and add the <Directory> + ProxyPass lines below.

<VirtualHost *:443>
    ServerName ranz-bontogon.com
    ServerAlias www.ranz-bontogon.com

    # --- serve the built React app ---
    DocumentRoot /var/www/ranz-website/client/dist

    <Directory /var/www/ranz-website/client/dist>
        Require all granted
        Options -Indexes
        # Client-side routing: unknown paths fall back to index.html
        FallbackResource /index.html
    </Directory>

    # --- API, media and admin auth go to the Node server ---
    # (these must come BEFORE FallbackResource takes effect for those paths)
    ProxyPreserveHost On
    ProxyPass        /api    http://127.0.0.1:3001/api
    ProxyPassReverse /api    http://127.0.0.1:3001/api
    ProxyPass        /media  http://127.0.0.1:3001/media
    ProxyPassReverse /media  http://127.0.0.1:3001/media

    # --- keep your existing SSL config here ---
    # SSLEngine on
    # SSLCertificateFile    /etc/letsencrypt/live/ranz-bontogon.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/ranz-bontogon.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/ranz_error.log
    CustomLog ${APACHE_LOG_DIR}/ranz_access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Simpler alternative: proxy EVERYTHING to Node (the Node server already
# serves the built client, the API and media). Use this instead of the vhost
# above if you'd rather not manage the DocumentRoot. Requires:
#   sudo a2enmod proxy proxy_http
#
# <VirtualHost *:443>
#     ServerName ranz-bontogon.com
#     ProxyPreserveHost On
#     ProxyPass        /  http://127.0.0.1:3001/
#     ProxyPassReverse /  http://127.0.0.1:3001/
#     # ...SSL config...
# </VirtualHost>
